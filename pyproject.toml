[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-cyborgdb"
version = "0.1.0"
description = "LangChain integration for CyborgDB: The Confidential Vector Database"
readme = "README.md"
requires-python = ">= 3.10"
license = "MIT"
authors = [{ name = "Cyborg Inc." }]
keywords = ["langchain", "vectorstore", "cyborgdb", "encrypted", "vector database"]
dependencies = ["cyborgdb-core[langchain] >= 0.18.0"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
"Homepage" = "https://www.cyborg.co"
"Documentation" = "https://docs.cyborg.co/versions/latest/integrations/langchain/introduction"
"Repository" = "https://github.com/cyborginc/langchain-cyborgdb"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["langchain_cyborgdb*"]
