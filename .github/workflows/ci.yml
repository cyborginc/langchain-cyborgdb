name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package in a clean environment
        run: pip install .[test]
      - name: Run tests
        env:
          # Functional quickstart test is skipped when this secret is absent.
          CYBORGDB_API_KEY: ${{ secrets.CYBORGDB_API_KEY }}
        run: pytest tests/ -v
      - name: Acceptance-criteria import check
        run: python -c "from langchain_cyborgdb import CyborgVectorStore, StorageConfig; print('ok')"
